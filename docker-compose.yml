# Uygulama + otomatik HTTPS (Caddy). Kullanım: README.md
services:
  defter:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # Veritabanı ve fişler burada; yedeğini alın. Kapsayıcı açılırken klasörü
      # uygulama kullanıcısına (10001) kendisi verir, elle bir şey yapmak gerekmez.
      - ./veri:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN .env dosyasında tanımlı olmalı}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - defter

volumes:
  caddy_data:
  caddy_config:
